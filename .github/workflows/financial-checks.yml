name: Financial regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Financial tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TZ: UTC
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check all financial and integration regressions
        run: npm test
      - name: Check Gmail scheduler and retry behaviour
        run: python3 -m unittest discover -s tests/automation -p 'test_*.py'
      - name: Check Indian dates from a foreign timezone
        env:
          TZ: America/Los_Angeles
        run: >-
          node --experimental-transform-types
          --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          --import ./tests/loader.mjs --test
          tests/engine/spending-calendar.test.ts
          tests/engine/spending-drivers.test.ts
          tests/engine/subscription-overview.test.ts
      - name: Build production application
        run: npm run build
      - name: Check types after route generation
        run: npm run typecheck
      - name: Record successful checks
        run: |
          {
            echo '## Financial regression checks passed'
            echo ''
            echo '- Full TypeScript test suite'
            echo '- Gmail sync caller and schedule tests'
            echo '- Indian date regressions in America/Los_Angeles'
            echo '- Production build and post-build typecheck'
            echo ''
            echo 'Uses synthetic fixtures and isolated test databases. Does not access Gmail or the live ledger.'
          } >> "$GITHUB_STEP_SUMMARY"
